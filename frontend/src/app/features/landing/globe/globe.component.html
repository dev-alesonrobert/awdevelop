<section class="section globe-section" id="conexoes" aria-labelledby="globe-title">
<div class="globe-copy">
<span class="eyebrow">DO SEU NEGÓCIO PARA O MUNDO</span>
<h2 data-edit-key="globo-01" id="globe-title">{{content().blocks['globo-01']}}</h2>
<p data-edit-key="globo-02">{{content().blocks['globo-02']}}</p>
<a [hidden]="!contactAvailable()" class="text-link" href="#contato">Vamos conectar sua ideia</a>
<div class="globe-services">
<span>Sites</span>
<span>Sistemas</span>
<span>Integrações</span>
</div>
</div>
<div class="globe-visual">
<iframe #motion class="brand-motion" src="/assets/awdevelop-motion.html" title="Animação da marca AWDevelop — Soluções em tecnologia" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
<div class="globe-caption">
<span>IDEIAS QUE SE CONECTAM</span>
<button [attr.aria-pressed]="paused()" (click)="toggle()" id="globe-toggle" type="button" aria-pressed="false" [attr.aria-label]="paused() ? 'Reproduzir animação' : 'Pausar animação'">{{paused()?'Reproduzir animação':'Pausar animação'}}</button>
</div>
</div>
</section>
