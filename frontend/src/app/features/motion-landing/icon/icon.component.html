<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.5"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  @switch (type()) {
    @case ("arrow") {
      <path d="M5 12h14M13 6l6 6-6 6" />
    }
    @case ("cursor") {
      <path d="m5 3 14 9-7 1-3 7-4-17Z" />
      <path d="m13 14 5 6" />
    }
    @case ("window") {
      <rect x="3" y="4" width="18" height="16" rx="3" />
      <path d="M3 9h18M7 6.5h.01M10 6.5h.01m-2 6-2 2 2 2m8-4 2 2-2 2" />
    }
    @case ("nodes") {
      <rect x="9" y="3" width="6" height="6" rx="1.5" />
      <rect x="2" y="15" width="6" height="6" rx="1.5" />
      <rect x="16" y="15" width="6" height="6" rx="1.5" />
      <path d="M12 9v3H5v3m7-3h7v3" />
    }
    @case ("bolt") {
      <path d="m13 2-9 12h7l-1 8 10-12h-7l1-8Z" />
    }
    @case ("check") {
      <path d="m8 12 3 3 5-6" />
      <path d="m12 2 8 4v6c0 5-8 10-8 10S4 17 4 12V6l8-4Z" />
    }
    @case ("replay") {
      <path d="M3 10a9 9 0 1 1 2 8M3 4v6h6" />
    }
    @case ("menu") {
      <path d="M4 6h16M4 12h16M4 18h16" />
    }
    @case ("close") {
      <path d="m6 6 12 12M18 6 6 18" />
    }
  }
</svg>
