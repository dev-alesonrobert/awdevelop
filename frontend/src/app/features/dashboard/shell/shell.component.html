<div class="app-layout">
  <aw-sidebar [role]="auth.profile()?.role" />
  <main class="workspace">
    <aw-topbar [commercial]="auth.profile()?.role!=='editor'" [name]="auth.profile()?.name" [busy]="busy()" (logout)="logout()" />
    <p class="message" role="status">{{ message() }}</p>
    <router-outlet />
  </main>
</div>
