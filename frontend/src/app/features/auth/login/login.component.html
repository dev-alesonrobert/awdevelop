<main class="login-wrap">
  <section class="login-card">
    <aw-brand />
    <p class="eyebrow">PAINEL AWDEVELOP</p>
    <h1>Entrar no painel</h1>
    <p class="muted">Gerencie o site e as oportunidades da AW Develop.</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>E-mail
        <input type="email" formControlName="email" autocomplete="username" required>
      </label>
      <label>Senha
        <input type="password" formControlName="password" autocomplete="current-password" required>
      </label>
      <button type="submit" [disabled]="busy()">{{ busy() ? 'Entrando…' : 'Entrar no painel' }}</button>
      <p role="status" class="message">{{ message() }}</p>
    </form>
    <a href="/">Voltar ao site ↗</a>
  </section>
</main>
