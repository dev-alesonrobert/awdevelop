<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>awdevelop — Motion</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d111a;--purple:#6d28ff;--u:min(5.3vw,9vh);box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:'Outfit',system-ui,sans-serif}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:out .5s 6.5s ease-in both}
.glow{position:absolute;width:70vmax;height:70vmax;border-radius:50%;background:radial-gradient(circle,rgba(109,40,255,.35),transparent 60%);opacity:0;animation:glow 2s .1s ease-out both,pulse 2.2s 4.4s ease-in-out both}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:6vmin 6vmin;mask-image:radial-gradient(circle,#000 10%,transparent 65%);-webkit-mask-image:radial-gradient(circle,#000 10%,transparent 65%);opacity:0;animation:fade 1.5s .2s both}
.logo{position:relative;display:flex;align-items:center}
.icon{width:calc(var(--u)*3.2);height:calc(var(--u)*3.2);flex:none;transform:scale(.5) rotate(-12deg);opacity:0;animation:pop 1s .3s cubic-bezier(.2,1.4,.4,1) both,shine 1.8s 4.6s ease-in-out both;filter:drop-shadow(0 0 0 rgba(109,40,255,0))}
.a{animation:fromL .8s .7s cubic-bezier(.2,.9,.3,1) both}
.v{animation:fromR .8s .9s cubic-bezier(.2,.9,.3,1) both}
.word{display:flex;overflow:hidden;white-space:nowrap;max-width:0;padding:0;font-size:calc(var(--u)*2.3);font-weight:600;color:#fafafa;letter-spacing:-.02em;line-height:1.3;animation:expand 1.2s 2.2s cubic-bezier(.7,0,.2,1) both}
.word span{display:inline-block;transform:translateY(110%);opacity:0;animation:rise .7s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(2.45s + var(--i)*.07s)}
.word::after{content:"";position:absolute;right:0;top:0;bottom:0;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-300%);animation:sweep 1.1s 5s ease-in-out both;mix-blend-mode:overlay;pointer-events:none}
.tag{margin-top:calc(var(--u)*1.1);text-align:center;color:#a9a3c4;font-size:calc(var(--u)*.62);font-weight:500;letter-spacing:.32em;text-transform:uppercase;opacity:0;transform:translateY(12px);animation:up .9s 3.9s ease-out both}
.line{margin-top:calc(var(--u)*.5);height:3px;width:calc(var(--u)*4);border-radius:3px;background:linear-gradient(90deg,transparent,var(--purple),transparent);transform:scaleX(0);animation:grow .9s 4.1s ease-out both}
button{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));background:rgba(255,255,255,.08);color:#ddd;border:0;border-radius:99px;padding:8px 14px;font:500 13px 'Outfit',sans-serif;opacity:.6}
@keyframes glow{to{opacity:1}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes fade{to{opacity:1}}
@keyframes pop{to{transform:none;opacity:1}}
@keyframes shine{50%{filter:drop-shadow(0 0 28px rgba(109,40,255,.9))}}
@keyframes fromL{from{transform:translateX(-45%);opacity:0}to{transform:none;opacity:1}}
@keyframes fromR{from{transform:translateX(45%);opacity:0}to{transform:none;opacity:1}}
@keyframes expand{to{max-width:calc(var(--u)*13);padding:0 0 0 calc(var(--u)*.7)}}
@keyframes rise{to{transform:none;opacity:1}}
@keyframes sweep{to{transform:translateX(450%)}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes out{to{opacity:0;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}

.paused *, .paused *::after {animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){
.scene{opacity:1!important;transform:none!important;animation:none!important}
.word::after{display:none}
}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="logo">
    <svg class="icon" viewBox="158 160 940 930" aria-label="Ícone awdevelop">
      <defs><clipPath id="c"><rect x="158" y="160" width="940" height="930" rx="190"/></clipPath></defs>
      <g clip-path="url(#c)">
        <rect x="158" y="160" width="940" height="930" fill="#6d28ff"/>
        <path class="a" fill="#fff" d="M150 868L375 482Q436 410 497 480L660 782Q672 805 650 825L568 830Q550 830 545 815L436 617L290 880Q280 893 262 893L150 893Z"/>
        <path class="v" fill="#fff" d="M565 505Q560 480 585 478L682 478Q692 478 697 488L790 660L962 370Q972 351 995 351L1100 351L1100 375L850 795Q825 833 790 833Q750 833 725 795Z"/>
      </g>
    </svg>
    <div class="word" aria-label="awdevelop">
      <span style="--i:0">a</span><span style="--i:1">w</span><span style="--i:2">d</span><span style="--i:3">e</span><span style="--i:4">v</span><span style="--i:5">e</span><span style="--i:6">l</span><span style="--i:7">o</span><span style="--i:8">p</span>
    </div>
  </div>
  <div class="tag">Soluções em tecnologia</div>
  <div class="line"></div>
</div>

<script>
const motion = matchMedia('(prefers-reduced-motion: reduce)');
let scene = document.getElementById('scene');
let timer;
let paused = false;
function restart() {
  const next = scene.cloneNode(true);
  scene.replaceWith(next);
  scene = next;
}
function schedule() {
  clearInterval(timer);
  if (!motion.matches && !paused && !document.hidden) timer = setInterval(restart, 7000);
}
function update() {
  document.documentElement.classList.toggle('paused', paused || document.hidden);
  schedule();
}
addEventListener('message', event => {
  if (event.source !== parent || event.data?.type !== 'aw-motion-pause') return;
  paused = Boolean(event.data.paused);
  update();
});
motion.addEventListener('change', update);
document.addEventListener('visibilitychange', update);
update();
</script>
</body>
</html>
