services:
  searxng:
    image: searxng/searxng@sha256:9b61996edcc679fb6665290f95fda15389a14eda6060e41a25c63ab2758f2436
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Configure um segredo aleatorio}
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - search-cache:/var/cache/searxng
  gateway:
    image: node:24-alpine
    restart: unless-stopped
    user: node
    working_dir: /app
    command: [node, gateway.mjs]
    environment:
      SEARXNG_TOKEN: ${SEARXNG_TOKEN:?Configure um token privado de pelo menos 32 caracteres}
      SEARXNG_INTERNAL_URL: http://searxng:8080
    volumes:
      - ./gateway.mjs:/app/gateway.mjs:ro
    ports:
      - 127.0.0.1:8088:8088
    depends_on:
      - searxng
volumes:
  search-cache:
